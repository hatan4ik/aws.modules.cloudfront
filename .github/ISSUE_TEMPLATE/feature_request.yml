name: Feature request
description: Propose a new input, output, or behaviour for the module.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do with the module today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Proposed interface
      description: The variables, outputs, or resources you expect, written as HCL.
      render: hcl
      placeholder: |
        variable "example" {
          description = "..."
          type        = string
          default     = null
        }
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it belong?
      options:
        - distribution or Origin Access Control (main.tf)
        - the required_bucket_policy_json statement (locals.tf, outputs.tf)
        - advisory checks (checks.tf)
        - a new example
        - the integration suite
        - not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, such as bring-your-own inputs or wrapping the module.
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: The proposal does not require the module to add data sources beyond the documented partition fallback.
        - label: The proposal is backwards compatible, or the breaking change is called out above.
        - label: The proposal does not blur ADR 0004's separation of static (CloudFront/S3) and dynamic (Global Accelerator/ALB) delivery paths, for example by adding a second origin type.
